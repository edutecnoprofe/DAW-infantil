<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Estudio 🎵</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="bPlay" class="big green" title="Tocar / Parar (Espacio)">▶</button>
    <button id="bRec" class="big red" title="Grabar (R)">⏺</button>
    <button id="bUndo" class="btn" title="Deshacer lo último grabado"><b>↩️</b><small>Deshacer</small></button>
    <div class="group" title="Velocidad">
      <button id="bSlow" class="btn"><b>🐢</b></button>
      <div id="tempo">100</div>
      <button id="bFast" class="btn"><b>🐇</b></button>
    </div>
    <button id="bMetro" class="btn toggle" title="Metrónomo"><b>⏱️</b><small>Tic-tac</small></button>
    <button id="bQuant" class="btn toggle" title="Imán: coloca las notas en su sitio"><b>🧲</b><small id="quantLbl">Imán</small></button>
    <div class="group" id="bars" title="Largo del bucle (compases)"></div>
    <span class="spacer"></span>
    <div id="midiStatus" title="Teclados conectados">🔌</div>
    <button id="bSave" class="btn" title="Guardar la canción en el ordenador"><b>💾</b><small>Guardar</small></button>
    <button id="bOpen" class="btn" title="Abrir una canción guardada"><b>📂</b><small>Abrir</small></button>
    <button id="bNew" class="btn" title="Canción nueva"><b>🗑️</b><small>Nueva</small></button>
    <button id="bSet" class="btn" title="Ajustes"><b>⚙️</b><small>Ajustes</small></button>
  </header>

  <main id="tracks"></main>

  <section id="panel">
    <button id="instCard" title="Cambiar instrumento"></button>
    <div id="pads"></div>
    <div id="knobs"></div>
  </section>

  <div id="piano"></div>
</div>

<div id="countIn" hidden></div>
<div id="learnBar" hidden></div>
<div id="toast" hidden></div>
<div id="modal" hidden><div id="modalBox"></div></div>
<div id="start"><button id="bStart">🎵<span>¡Empezar!</span></button></div>

<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
